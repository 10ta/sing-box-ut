# Builds sing-box-ut from upstream sing-box + sing-box-lx files + patches.
#
# Modes:
#   release    a push to main, or Run workflow: build main and publish it
#   candidate  called by update.yml with new pins: build them on top of main,
#              and only if the core checks pass, commit the pins to main
#              ("promote") and publish. A failed candidate leaves main alone.
#   apk        called by update.yml: build only the Android APK for an existing
#              release that lacks one, and attach it
#
# Release files are all named sing-box_<version>_<os>_<arch>.<ext>: "_" only
# separates fields (the version itself contains "-"), and it is the Debian
# convention for .deb files, so official and -ut .deb names have one shape.
#
# Jobs: resolve, test, binaries (Linux .deb/.tar.gz, Windows .zip), interop
# (against Xray), android (APK), promote, release, report (a GitHub issue with
# the failure details), notify (Telegram).
# Core checks = test + binaries + interop. Android never blocks a release.
name: build

on:
  push:
    branches: [main]
    paths:
      - patches/**
      - overlay/**
      - scripts/**
      - test/**
      - lx-files.txt
      - lx.ref
      - upstream.ref
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release
        type: boolean
        default: true
  workflow_call:
    inputs:
      mode:
        description: candidate | apk
        type: string
        required: true
      upstream_ref:
        description: "candidate: sing-box tag to try"
        type: string
        default: ""
      lx_ref:
        description: "candidate: sing-box-lx commit to try"
        type: string
        default: ""
      base_sha:
        description: "candidate: the main commit the pins go on top of"
        type: string
        default: ""
      subject:
        description: "candidate: commit subject for the promotion"
        type: string
        default: ""
      body:
        description: "candidate: commit body (what changed)"
        type: string
        default: ""
      release_tag:
        description: "apk: the release to complete"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.mode || 'release' }}-${{ github.ref }}
  # A newer push supersedes a running release build; a candidate or APK build
  # is never cancelled half way.
  cancel-in-progress: ${{ !inputs.mode }}

env:
  # Pinned: Xray changes server defaults between releases. Bump after re-running the interop.
  XRAY_VERSION: v26.11.9

jobs:
  resolve:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.refs.outputs.mode }}
      source_sha: ${{ steps.refs.outputs.source_sha }}
      upstream_ref: ${{ steps.refs.outputs.upstream_ref }}
      lx_ref: ${{ steps.refs.outputs.lx_ref }}
      release_tag: ${{ steps.refs.outputs.release_tag }}
      version: ${{ steps.refs.outputs.version }}
      publish: ${{ steps.refs.outputs.publish }}
      subject: ${{ steps.refs.outputs.subject }}
      body: ${{ steps.refs.outputs.body }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'release' }}
          PUBLISH: ${{ inputs.publish }}
          IN_UPSTREAM_REF: ${{ inputs.upstream_ref }}
          IN_LX_REF: ${{ inputs.lx_ref }}
          IN_BASE_SHA: ${{ inputs.base_sha }}
          IN_SUBJECT: ${{ inputs.subject }}
          IN_BODY: ${{ inputs.body }}
          IN_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          case $MODE in
            release)
              source_sha=$GITHUB_SHA
              upstream_ref=$(tr -d '[:space:]' < upstream.ref)
              lx_ref=$(tr -d '[:space:]' < lx.ref)
              subject=$(git log -1 --format=%s "$source_sha")
              body=$(git log -1 --format=%b "$source_sha")
              ;;
            candidate)
              source_sha=$IN_BASE_SHA
              upstream_ref=$IN_UPSTREAM_REF
              lx_ref=$IN_LX_REF
              subject=$IN_SUBJECT
              body=$IN_BODY
              ;;
            apk)
              release_tag=$IN_RELEASE_TAG
              source_sha=$(git rev-list -n 1 "refs/tags/$release_tag")
              # Releases made before upstream.ref existed: the tag name carries it.
              upstream_ref=$(git show "$source_sha:upstream.ref" 2>/dev/null | tr -d '[:space:]' || true)
              upstream_ref=${upstream_ref:-${release_tag%-ut*}}
              lx_ref=$(git show "$source_sha:lx.ref" | tr -d '[:space:]')
              subject="APK for $release_tag"
              body=
              ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          if [ "$MODE" != apk ]; then
            release_tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' \
              | scripts/next-release-tag.sh "$upstream_ref")
          fi
          publish=true
          [ "$PUBLISH" != false ] || publish=false
          {
            echo "mode=$MODE"
            echo "source_sha=$source_sha"
            echo "upstream_ref=$upstream_ref"
            echo "lx_ref=$lx_ref"
            echo "release_tag=$release_tag"
            echo "version=${release_tag#v}"
            echo "publish=$publish"
            echo "subject=$subject"
            echo "body<<UT_BODY_EOF"
            printf '%s\n' "$body"
            echo "UT_BODY_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| mode | $MODE |"
            echo "| release | \`$release_tag\` |"
            echo "| upstream | \`$upstream_ref\` |"
            echo "| lx | \`$lx_ref\` |"
            echo "| source | \`$source_sha\` |"
            echo "| change | $subject |"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Vet and unit tests
    needs: resolve
    if: needs.resolve.outputs.mode != 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Prepare source
        env:
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
        run: scripts/prepare.sh work
      - name: Go version
        id: go
        run: scripts/go-version.sh work >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: work/go.sum
      - name: Vet and test
        working-directory: work
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS),with_xhttp"
          packages="./option/ ./common/badh2/ ./common/lxtrace/ ./common/tls/ ./transport/v2ray/ ./transport/v2rayxhttp/ ./protocol/vless/..."
          # $packages is a list on purpose.
          # shellcheck disable=SC2086
          go vet -tags "$tags" $packages
          # shellcheck disable=SC2086
          go test -count=1 -race -tags "$tags" $packages

  binaries:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: resolve
    if: needs.resolve.outputs.mode != 'apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Prepare source
        env:
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
        run: scripts/prepare.sh work
      - name: Go version
        id: go
        run: scripts/go-version.sh work >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: work/go.sum
      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          exe=sing-box; [ "$GOOS" = windows ] && exe=sing-box.exe
          scripts/build.sh work "bin/$exe" "$VERSION"
          # The naive outbound loads this library at run time.
          scripts/fetch-cronet.sh work "$GOOS" "$GOARCH" bin
      - name: Package .deb and .tar.gz
        if: matrix.os == 'linux'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          scripts/package-deb.sh work bin/sing-box "${{ matrix.arch }}" "$VERSION" "dist/sing-box_${VERSION}_linux_${{ matrix.arch }}.deb" bin/libcronet.so
          # Plain archive: one directory with the binary, the library the naive
          # outbound loads from beside it, and the license.
          name="sing-box_${VERSION}_linux_${{ matrix.arch }}"
          mkdir "$name"
          cp bin/sing-box bin/libcronet.so work/LICENSE "$name/"
          tar -czf "dist/$name.tar.gz" --owner=0 --group=0 "$name"
      - name: Package .zip
        if: matrix.os == 'windows'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Same layout as the Linux archive: one directory, the .exe and the .dll side by side.
          name="sing-box_${VERSION}_windows_${{ matrix.arch }}"
          mkdir "$name"
          cp bin/sing-box.exe bin/libcronet.dll work/LICENSE "$name/"
          zip -q -r "dist/$name.zip" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  interop:
    name: Interop with Xray
    needs: [resolve, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist
      - name: Unpack the binary
        run: |
          set -euo pipefail
          dpkg-deb -x dist/*.deb pkg
          pkg/usr/bin/sing-box version
      - name: Fetch Xray
        run: |
          set -euo pipefail
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip"
          unzip -q xray.zip xray -d xray-bin && chmod +x xray-bin/xray
          xray-bin/xray version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Interop
        run: test/interop/run.sh pkg/usr/bin/sing-box xray-bin/xray
      - name: Naive outbound starts
        run: test/naive-start.sh pkg/usr/bin/sing-box pkg/usr/lib/libcronet.so

  android:
    name: Android arm64-v8a
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Prepare source
        env:
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
        run: scripts/prepare.sh work
      - name: Fetch the Android client
        run: scripts/android-client.sh work
      - name: Go version
        id: go
        run: scripts/go-version.sh work >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: work/go.sum
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build libbox
        working-directory: work
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          make lib_install
          gopath=$(go env GOPATH)
          export PATH="$PATH:$gopath/bin"
          # overlay/cmd/internal/build_libbox/ut_tags.go adds with_xhttp.
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          mkdir -p clients/android/app/libs
          cp libbox.aar libbox-legacy.aar clients/android/app/libs/
      - name: Signing key
        id: signing
        working-directory: work/clients/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          set -euo pipefail
          # The Android client ships upstream's own release.keystore; ours replaces it.
          rm -f app/release.keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
            store_pass=$ANDROID_KEYSTORE_PASS; key_pass=${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}
            entries=$(keytool -list -keystore app/release.keystore -storepass "$store_pass") \
              || { echo "::error::cannot open the keystore: check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS"; exit 1; }
            alias=${ANDROID_KEY_ALIAS:-$(printf '%s\n' "$entries" | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | sed -n 1p)}
            [ -n "$alias" ] || { echo "::error::the keystore has no private key entry"; exit 1; }
            echo "signed=release" >> "$GITHUB_OUTPUT"
          else
            # No key configured: a throwaway key. Such an APK installs, but cannot
            # update an APK from another run (the signature differs every time).
            store_pass=throwaway; alias=throwaway; key_pass=throwaway
            keytool -genkeypair -keystore app/release.keystore -storepass "$store_pass" -keypass "$key_pass" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=sing-box-ut throwaway"
            echo "signed=throwaway" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a throwaway key"
          fi
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' "$store_pass" "$alias" "$key_pass" > local.properties
      - name: Build APK
        working-directory: work/clients/android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=$VERSION/" version.properties
          cat version.properties
          ./gradlew --no-daemon :app:assembleOtherRelease
          ls -la app/build/outputs/apk/other/release/
          mkdir -p "$GITHUB_WORKSPACE/dist"
          suffix=; [ "${{ steps.signing.outputs.signed }}" = throwaway ] && suffix=_throwaway-key
          cp app/build/outputs/apk/other/release/*arm64-v8a*.apk "$GITHUB_WORKSPACE/dist/sing-box_${VERSION}_android_arm64${suffix}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android-arm64
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  promote:
    name: Promote to main
    needs: [resolve, test, binaries, interop]
    if: needs.resolve.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.push.outputs.promoted }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Commit the pins to main
        id: push
        env:
          BASE_SHA: ${{ needs.resolve.outputs.source_sha }}
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
          BODY: ${{ needs.resolve.outputs.body }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$BASE_SHA" ]; then
            # main moved while the candidate was built. The next daily run starts
            # over from the new main; nothing is wrong.
            echo "::warning::main moved since $BASE_SHA; not promoting"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$UPSTREAM_REF" > upstream.ref
          echo "$LX_REF" > lx.ref
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "$SUBJECT" -m "$BODY" -- upstream.ref lx.ref
          git push origin HEAD:main
          { echo "promoted=true"; echo "sha=$(git rev-parse HEAD)"; } >> "$GITHUB_OUTPUT"

  release:
    name: Publish prerelease
    needs: [resolve, test, binaries, interop, android, promote]
    # Android may fail without blocking the other artifacts.
    if: >-
      always() && needs.resolve.outputs.publish == 'true' && (
        (needs.resolve.outputs.mode == 'release'
          && needs.test.result == 'success' && needs.binaries.result == 'success' && needs.interop.result == 'success')
        || (needs.resolve.outputs.mode == 'candidate' && needs.promote.outputs.promoted == 'true')
        || (needs.resolve.outputs.mode == 'apk' && needs.android.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          TAG: ${{ needs.resolve.outputs.release_tag }}
          TARGET: ${{ needs.promote.outputs.sha || needs.resolve.outputs.source_sha }}
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
          BODY: ${{ needs.resolve.outputs.body }}
          ANDROID: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          ls -la dist
          if [ "$MODE" = apk ]; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          {
            echo "Built from sing-box \`$UPSTREAM_REF\` with the XHTTP client and VLESS encryption of sing-box-lx (\`$LX_REF\`) and this repository at \`$TARGET\`."
            echo
            echo "**Change:** $SUBJECT"
            if [ -n "$BODY" ]; then echo; echo '```text'; printf '%s\n' "$BODY"; echo '```'; fi
            echo
            if [ "$ANDROID" = success ]; then
              echo "Android APK: included."
            else
              echo "Android APK: not built in this run (usually the Android client has not caught up with this sing-box version yet). The daily update retries and attaches it here."
            fi
          } > notes.md
          gh release create "$TAG" dist/* --prerelease --title "$TAG" --notes-file notes.md \
            --target "$TARGET" --repo "$GITHUB_REPOSITORY"
      - name: Close the failure issue of this update
        if: needs.resolve.outputs.mode == 'candidate'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "自动更新失败：${{ needs.resolve.outputs.subject }}"
          TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --label auto-update --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" |
          while read -r number; do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Passed and released as $TAG."
          done

  report:
    name: Report the failure
    needs: [resolve, test, binaries, interop, promote]
    if: >-
      always() && needs.resolve.outputs.mode != 'apk' && (
        needs.test.result == 'failure' || needs.binaries.result == 'failure'
        || needs.interop.result == 'failure' || needs.promote.result == 'failure'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    outputs:
      issue_url: ${{ steps.issue.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Open or update the issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.resolve.outputs.mode }}
          BASE_SHA: ${{ needs.resolve.outputs.source_sha }}
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
          BODY: ${{ needs.resolve.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-issue.sh

  notify:
    name: Notify
    needs: [resolve, test, binaries, interop, android, promote, release, report]
    # An APK backfill only reports when it worked; everything else always reports.
    if: >-
      always() && (
        needs.resolve.outputs.mode != 'apk'
        || (needs.android.result == 'success' && needs.release.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
      - name: Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MODE: ${{ needs.resolve.outputs.mode }}
          PROMOTED: ${{ needs.promote.outputs.promoted }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          UPSTREAM_REF: ${{ needs.resolve.outputs.upstream_ref }}
          LX_REF: ${{ needs.resolve.outputs.lx_ref }}
          SUBJECT: ${{ needs.resolve.outputs.subject }}
          ISSUE_URL: ${{ needs.report.outputs.issue_url }}
          EVENT: ${{ github.event_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          R_TEST: ${{ needs.test.result }}
          R_BINARIES: ${{ needs.binaries.result }}
          R_INTEROP: ${{ needs.interop.result }}
          R_ANDROID: ${{ needs.android.result }}
          R_PROMOTE: ${{ needs.promote.result }}
          R_RELEASE: ${{ needs.release.result }}
        run: scripts/notify-telegram.sh
