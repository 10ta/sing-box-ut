# Verifies patches/0002-lx-xhttp-download.patch on its own: apply it to
# sing-box-lx (branch lx-1.15), run the unit tests, build a client and run it
# against a real Xray server with the download half routed through a second
# address (test/interop).
name: verify-download

on:
  workflow_dispatch:
    inputs:
      lx_ref:
        description: sing-box-lx branch, tag or full commit SHA
        default: lx-1.15
      xray_version:
        description: Xray-core release tag for the interop test
        default: v26.11.9
  push:
    paths:
      - patches/0002-lx-xhttp-download.patch
      - test/interop/**
      - .github/workflows/verify-download.yml

permissions:
  contents: read

concurrency:
  group: verify-download-${{ github.ref }}
  cancel-in-progress: true

env:
  LX_REPO: https://github.com/Leadaxe/sing-box-lx
  LX_REF: ${{ inputs.lx_ref || 'lx-1.15' }}
  # Pinned: Xray changes server defaults between releases (26.11.9 started
  # blocking loopback targets in freedom). Bump after re-running the interop.
  XRAY_VERSION: ${{ inputs.xray_version || 'v26.11.9' }}
  TAGS: with_quic,with_utls,with_clash_api,with_xhttp,badlinkname,tfogo_checklinkname0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Fetch sing-box-lx
        run: |
          git init -q lx
          git -C lx remote add origin "$LX_REPO"
          git -C lx fetch -q --depth 1 origin "$LX_REF"
          git -C lx checkout -q FETCH_HEAD
          # lx's go.mod replaces sing-tun, wireguard-go and utls with these submodules.
          git -C lx submodule update --init --depth 1
          echo "lx at $(git -C lx rev-parse --short HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply the download patch
        run: git -C lx apply --index -v ../patches/0002-lx-xhttp-download.patch

      - name: Go version
        id: go
        run: |
          if [ -f lx/go.version ]; then
            echo "version=$(tr -d '[:space:]' < lx/go.version | sed 's/^go//')" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(sed -n 's/^go //p' lx/go.mod)" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: lx/go.sum

      - name: gofmt + vet
        working-directory: lx
        run: |
          test -z "$(gofmt -l option/v2ray_xhttp*.go transport/v2rayxhttp/ | tee /dev/stderr)"
          go vet -tags "$TAGS" ./option/ ./transport/v2rayxhttp/

      - name: Unit tests
        working-directory: lx
        run: go test -count=1 -race -tags "$TAGS" ./option/ ./transport/v2rayxhttp/

      - name: Build
        working-directory: lx
        run: CGO_ENABLED=0 go build -trimpath -tags "$TAGS" -ldflags "-s -w -checklinkname=0" -o ../sing-box ./cmd/sing-box

      - name: Fetch Xray
        run: |
          curl -fsSL -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION/Xray-linux-64.zip"
          unzip -q xray.zip xray -d xray-bin && chmod +x xray-bin/xray
          xray-bin/xray version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Interop (upload and download on different addresses)
        run: test/interop/run.sh ./sing-box xray-bin/xray
